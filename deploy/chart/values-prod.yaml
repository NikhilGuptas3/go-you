# Values for the go-you POC on the prod cluster (namespace-segregated, port-forward only).
replicaCount: 1

image:
  repository: 390403892071.dkr.ecr.ap-south-1.amazonaws.com/you/prod
  tag: latest # overridden by --set image.tag=<tag> from push-goyou.sh
  pullPolicy: IfNotPresent

# Per-crawler HTTP timeout. 5s: Instagram-via-residential-proxy needs > the old 2s.
crawlerHttpTimeoutMs: "5000"

resources:
  # Bumped after the 128Mi pod OOMKilled at ~9 QPS in the in-cluster loadtest
  # (42 errors: EOF -> connection reset -> connection refused -> restart, all
  # failing to reach go-you itself). Generous headroom so throughput/latency
  # measurements aren't limited by the pod resources.
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

# Prometheus Operator scraping. The prod cluster runs kube-prometheus-stack;
# its Prometheus CR selects ServiceMonitors with label `release: prometheus`
# and watches all namespaces (verified 2026-07). Toggle off to disable scraping.
serviceMonitor:
  enabled: true
  releaseLabel: prometheus   # MUST match the Prometheus CR's serviceMonitorSelector
  interval: 30s
  scrapeTimeout: 10s

# Ingress — routes an external host to the ClusterIP Service (port 80 -> 5000)
# via the cluster's shared nginx ingress class. Only the persona API is exposed;
# /metrics, /healthz and /readyz are intentionally NOT routed (metrics are
# scraped in-cluster by the ServiceMonitor; probes are kubelet-only).
ingress:
  enabled: true
  # The cluster's shared ingress class (kubectl get ingressclass ->
  # internal-shared, controller k8s.io/internal-shared). NOT "nginx".
  className: internal-shared
  annotations:
    # Persona payloads and crawler fan-out can exceed the ingress defaults.
    # NOTE: these nginx.ingress.kubernetes.io/* annotations are honored only if
    # internal-shared is an ingress-nginx controller. If it is a different
    # controller (e.g. Traefik/HAProxy), swap these for that controller's
    # equivalents or drop them. Confirm with the platform team.
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  hosts:
    - host: go.you.sign3.in
      paths:
        - path: /
          pathType: Prefix
  # TLS (optional): uncomment and point at a cert Secret (e.g. cert-manager).
  # tls:
  #   - hosts:
  #       - go.you.sign3.in
  #     secretName: go-you-tls
