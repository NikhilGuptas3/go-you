# Template for the go-you-secrets Secret. DO NOT put real values in this file.
# Copy it to secret.yaml (gitignored), fill in real values, then:
#   kubectl apply -n go-you-poc -f secret.yaml
#
# MYSQL_DSN format: user:password@tcp(host:3306)/dbname?parseTime=true&timeout=5s
#   -> tenant/config DB (the `user` DB).
# STATIC_MYSQL_DSN: the SEPARATE static-persona DB (Python SQL_YOU: the `you`
#   cluster/db). Different host+db+credential than MYSQL_DSN. Optional — leave
#   unset to disable the static lane (phone breach empty, digital_age error).
# PROXY_URL format: http://user:pass@host:port  (leave empty to crawl direct).
#   Use a plain, country-independent proxy string — no country/zone params baked
#   into the creds or host; the geo is a property of the endpoint you pick.
# NIMBLE_PROXY_URL / SMARTPROXY_URL: optional NAMED vendor egresses for sites
#   hey-you pins away from the default proxy (their login/home endpoints 403
#   PROXY_URL). Per-site routing: nimble => MICROSOFT/APPLE; smartproxy => QUORA
#   (US exit). Empty => those sites fall back to PROXY_URL.
#
# AWS services (all OPTIONAL — unset => that service off, go-you stays stateless):
#   DYNAMO_ORGANIC_TABLE : go-you's OWN DynamoDB table for the persona cache (PK
#     "id", string). Separate from prod's OrganicData. Empty => no persona cache.
#   DYNAMO_META_TABLE    : go-you's OWN DynamoDB table for the phone/email meta
#     cache (PK "id"). Separate from prod's EmailPhoneMeta. Empty => no meta cache.
#   KINESIS_STREAM_NAME  : go-you's OWN Kinesis stream for the analytics sink.
#     Empty => no analytics.
#   AWS_REGION / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY : resolved by the AWS
#     SDK default chain (like boto3). Prefer an IAM role (IRSA) over static keys;
#     set the keys here only if the pod has no role. Region is ap-south-1.
apiVersion: v1
kind: Secret
metadata:
  name: go-you-secrets
  namespace: go-you-poc
type: Opaque
stringData:
  MYSQL_DSN: "REPLACE_ME_user:pass@tcp(host:3306)/user?parseTime=true&timeout=5s"
  STATIC_MYSQL_DSN: "REPLACE_ME_youdbadmin:pass@tcp(you-host:3306)/you?parseTime=true&timeout=5s"
  PROXY_URL: "REPLACE_ME_http://user:pass@host:port"
  # NIMBLE_PROXY_URL: "http://user:pass@host:port"      # named egress: nimble (MICROSOFT/APPLE)
  # SMARTPROXY_URL: "http://user:pass@host:port"        # named egress: smartproxy (QUORA, US exit)
  # --- AWS (optional) ---
  DYNAMO_ORGANIC_TABLE: "go-you-OrganicData"
  DYNAMO_META_TABLE: "go-you-EmailPhoneMeta"
  KINESIS_STREAM_NAME: "go-you-analytics"
  AWS_REGION: "ap-south-1"
  # AWS_ACCESS_KEY_ID: "REPLACE_ME"       # omit if using an IAM role (IRSA)
  # AWS_SECRET_ACCESS_KEY: "REPLACE_ME"   # omit if using an IAM role (IRSA)
