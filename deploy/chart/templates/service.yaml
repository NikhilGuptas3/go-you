apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.deploymentName }}
  labels:
    app: {{ .Values.deploymentName }}
  # No prometheus.io/* annotations: scraping is via the ServiceMonitor
  # (job="go-you"). Annotation-based scrape would ALSO pull this target under
  # job="kubernetes_pods", storing every series twice and double-counting in
  # dashboard sum()/rate() queries. Keep a single scrape path.
spec:
  # ClusterIP only: no public ingress. Reach it with
  #   kubectl port-forward -n go-you-poc svc/go-you 8080:80
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.deploymentName }}
