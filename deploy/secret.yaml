apiVersion: v1
kind: Secret
metadata:
  name: go-you-secrets
  namespace: go-you-poc
type: Opaque
stringData:
  MYSQL_DSN: "dbadmin:aLG#tR4EU_nu@tcp(main.cluster-clmcecso4av4.ap-south-1.rds.amazonaws.com:3306)/user?parseTime=true&timeout=5s"
  # STATIC_MYSQL_DSN — the SEPARATE `you` cluster/db (Python SQL_YOU) holding the
  # inorganic/static persona tables. Different host+db+credential than MYSQL_DSN.
  # Feeds phone breach, static digital_age, linked_ids, and the ml_service static_data.
  STATIC_MYSQL_DSN: "youdbadmin:k$uT01tRSe_@tcp(you.cluster-clmcecso4av4.ap-south-1.rds.amazonaws.com:3306)/you?parseTime=true&timeout=5s"
  PROXY_URL: "http://brd-customer-hl_34977069-zone-residential-country-in-dns-local:8cv6uyaqczwg@servercountry-in.brd.superproxy.io:22225"
  # --- AWS services (TEST: pointed at the SHARED PROD tables/stream). go-you
  # reads AND writes prod's OrganicData / EmailPhoneMeta and publishes to prod's
  # analytics-1 stream. Region ap-south-1. DEBUG_CACHE=1 logs every cache
  # GET (HIT/MISS) / PUT and each Kinesis publish so you can see whether data is
