# secret.yaml — go-you-secrets. Contains live values (POC only; move to a secret store later).
# Apply with: kubectl apply -n go-you-poc -f deploy/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: go-you-secrets
  namespace: go-you-poc
type: Opaque
stringData:
  MYSQL_DSN: "dbadmin:aLG#tR4EU_nu@tcp(main.cluster-clmcecso4av4.ap-south-1.rds.amazonaws.com:3306)/user?parseTime=true&timeout=5s"
  # STATIC_MYSQL_DSN — the SEPARATE `you` cluster/db (Python SQL_YOU) holding the
  # inorganic/static persona tables. Different host+db+credential than MYSQL_DSN.
  # Feeds phone breach, static digital_age, linked_ids, and the ml_service static_data.
  STATIC_MYSQL_DSN: "youdbadmin:k$uT01tRSe_@tcp(you.cluster-clmcecso4av4.ap-south-1.rds.amazonaws.com:3306)/you?parseTime=true&timeout=5s"
  # Default BrightData egress PINNED TO INDIA (-country-in). India geo is
  # required by the India e-commerce/OTT sites (Snapdeal, Gaana, Pinterest,
  # Flipkart …) — a POC proved Snapdeal returns 200+session-cookie on brd-in but
  # 403s on a plain/US exit. Do NOT strip the country pin: without it BrightData
  # exits a random geo (observed: Saudi Arabia) and those sites 403.
  PROXY_URL: "http://brd-customer-hl_34977069-zone-residential-country-in-dns-local:8cv6uyaqczwg@servercountry-in.brd.superproxy.io:22225"
  # NIMBLE_PROXY_URL / SMARTPROXY_URL — NAMED vendor egresses for the two sites
  # LIVE-VERIFIED to need a non-India exit (their login 403s BrightData). Per-site
  # routing (crawler.SiteEgress): nimble => APPLE (mints via Nimble); smartproxy
  # => MICROSOFT (US exit). Empty => those sites fall back to PROXY_URL.
  NIMBLE_PROXY_URL: "http://account-sign3labs-pipeline-nimbleip:81T7l1iY5r2Y@ip.nimbleway.com:7000"
  SMARTPROXY_URL: "http://user-sign3labs-focus-latency:sign3labspassword@us.decodo.com:10000"
  # --- AWS services (TEST: pointed at the SHARED PROD tables/stream). go-you
  # reads AND writes prod's OrganicData / EmailPhoneMeta and publishes to prod's
  # analytics-1 stream. Region ap-south-1. DEBUG_CACHE=1 logs every cache
  # GET (HIT/MISS) / PUT and each Kinesis publish so you can see whether data is
  # pulled from DynamoDB. Provide AWS creds (prefer an IAM role / IRSA; set the
  # keys below only if the pod has no role). ---
  DYNAMO_ORGANIC_TABLE: "OrganicData"
  DYNAMO_META_TABLE: "EmailPhoneMeta"
  KINESIS_STREAM_NAME: "analytics-1"
  AWS_REGION: "ap-south-1"
  DEBUG_CACHE: "1"
  # AWS creds are NOT stored here (GitHub push protection blocks them, and they
  # should never live in git). Inject them into the live k8s Secret instead:
  #   kubectl -n go-you-poc patch secret go-you-secrets --type merge -p \
  #     '{"stringData":{"AWS_ACCESS_KEY_ID":"...","AWS_SECRET_ACCESS_KEY":"..."}}'
  # AWS_ACCESS_KEY_ID: "<inject via kubectl patch>"
  # AWS_SECRET_ACCESS_KEY: "<inject via kubectl patch>"
